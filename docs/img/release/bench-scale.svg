<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" aria-labelledby="t d" role="img" viewBox="0 0 1600 940"><title id="t">Время планирования: TINY Flash и oracle</title><desc id="d">Логарифмическая шкала времени: TINY Flash растёт до 84 мс на 347 операциях, oracle упирается в бюджет 2 секунды.</desc><rect width="1600" height="940" fill="#F7F5F0"/><text x="70" y="66" fill="#2C5C99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">NEX CLI · 1.4 · СКОРОСТЬ</text><text x="70" y="124" fill="#1F1E1B" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="44" font-weight="700">TINY Flash масштабируется, oracle упирается в бюджет</text><text x="70" y="162" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20">время на один блок, миллисекунды · логарифмическая шкала</text><line x1="120" x2="1480" y1="700" y2="700" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="705" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">0,3</text><line x1="120" x2="1480" y1="637.3" y2="637.3" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="642.3" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">1</text><line x1="120" x2="1480" y1="580" y2="580" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="585" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">3</text><line x1="120" x2="1480" y1="517.3" y2="517.3" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="522.3" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">10</text><line x1="120" x2="1480" y1="460" y2="460" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="465" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">30</text><line x1="120" x2="1480" y1="397.3" y2="397.3" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="402.3" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">100</text><line x1="120" x2="1480" y1="340" y2="340" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="345" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">300</text><line x1="120" x2="1480" y1="277.3" y2="277.3" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="282.3" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">1000</text><line x1="120" x2="1480" y1="220" y2="220" stroke="#DCD6C9" stroke-dasharray="3 5" stroke-width="1"/><text x="102" y="225" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">3000</text><line x1="120" x2="120" y1="700" y2="707" stroke="#DCD6C9" stroke-width="1.5"/><text x="120" y="730" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="middle">0</text><line x1="460" x2="460" y1="700" y2="707" stroke="#DCD6C9" stroke-width="1.5"/><text x="460" y="730" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="middle">100</text><line x1="800" x2="800" y1="700" y2="707" stroke="#DCD6C9" stroke-width="1.5"/><text x="800" y="730" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="middle">200</text><line x1="1140" x2="1140" y1="700" y2="707" stroke="#DCD6C9" stroke-width="1.5"/><text x="1140" y="730" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="middle">300</text><line x1="1480" x2="1480" y1="700" y2="707" stroke="#DCD6C9" stroke-width="1.5"/><text x="1480" y="730" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="middle">400 оп.</text><text x="102" y="204" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" text-anchor="end">мс</text><polyline fill="none" stroke="#C0504D" stroke-dasharray="7 6" stroke-width="2.5" points="500.8 543 504.2 541.3 990.4 230.4 1299.8 230.1"/><polyline fill="none" stroke="#2C5C99" stroke-width="2.5" points="150.6 690.9 160.8 677.8 171 645.3 184.6 665.6 500.8 553.1 504.2 563.7 990.4 463.2 1299.8 406.1"/><circle cx="150.6" cy="690.9" r="6.5" fill="#2C5C99"/><circle cx="160.8" cy="677.8" r="6.5" fill="#2C5C99"/><circle cx="171" cy="645.3" r="6.5" fill="#2C5C99"/><circle cx="184.6" cy="665.6" r="6.5" fill="#2C5C99"/><circle cx="500.8" cy="553.1" r="6.5" fill="#2C5C99"/><circle cx="504.2" cy="563.7" r="6.5" fill="#2C5C99"/><circle cx="990.4" cy="463.2" r="6.5" fill="#2C5C99"/><circle cx="1299.8" cy="406.1" r="6.5" fill="#2C5C99"/><circle cx="500.8" cy="543" r="6" fill="#FFFDF8" stroke="#C0504D" stroke-width="2.5"/><circle cx="504.2" cy="541.3" r="6" fill="#FFFDF8" stroke="#C0504D" stroke-width="2.5"/><circle cx="990.4" cy="230.4" r="6" fill="#FFFDF8" stroke="#C0504D" stroke-width="2.5"/><circle cx="1299.8" cy="230.1" r="6" fill="#FFFDF8" stroke="#C0504D" stroke-width="2.5"/><text x="1315.8" y="411.1" fill="#2C5C99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700">84 мс</text><text x="1315.8" y="222.1" fill="#C0504D" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700">~2,5 с · бюджет</text><text x="964.4" y="270.4" fill="#C0504D" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="15" text-anchor="end">оптимум не доказан</text><circle cx="120" cy="760" r="7" fill="#2C5C99"/><text x="138" y="766" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17">TINY Flash (exact) · до 84 мс</text><circle cx="470" cy="760" r="6" fill="#FFFDF8" stroke="#C0504D" stroke-width="2.5"/><text x="488" y="766" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17">oracle, бюджет 2 с на файл</text><rect width="650" height="118" x="880" y="760" fill="#FFFDF8" stroke="#DCD6C9" stroke-width="1" rx="16"/><text x="910" y="799" fill="#1F1E1B" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700">Где предел</text><text x="910" y="827" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16">до ~150 операций oracle доказывает оптимум за миллисекунды.</text><text x="910" y="853" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16">на 256–347 операциях 2 секунды не хватает — TINY Flash даёт то же</text><text x="910" y="877" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16">решение за 28–84 мс, но без сертификата оптимальности.</text><text x="70" y="918" fill="#6F6A60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14">NEX CLI × Эльбрус · цифры: benchmarks/RESULTS.md, прогон на 8 файлах</text></svg>