<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1150"><title id="title">TINY Flash быстрее TINY AI в 26 раз</title><desc id="desc">TINY Flash даёт то же расписание, что TINY AI, но в 26 раз быстрее: 2,6 мс против 63,4 мс на граф.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfe"/><stop offset="1" stop-color="#e8f1fb"/></linearGradient><linearGradient id="flash" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2c5c99"/><stop offset="1" stop-color="#4b86cf"/></linearGradient><filter id="shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="10" flood-color="#123a66" flood-opacity=".08" stdDeviation="18"/></filter></defs><rect width="1600" height="1150" fill="url(#bg)"/><text x="80" y="82" fill="#2c5c99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6">TINY AI · СКОРОСТЬ</text><text fill="#0b2a4a" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="54" font-weight="700"><tspan x="80" y="170">TINY Flash быстрее TINY AI</tspan> <tspan x="80" y="238">в 26 раз — те же расписания</tspan></text><rect width="1440" height="430" x="80" y="300" fill="#fff" filter="url(#shadow)" rx="26"/><text x="140" y="360" fill="#7d93a8" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="600">меньше — лучше · миллисекунд на граф</text><text x="140" y="436" fill="#0b2a4a" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="28" font-weight="700">TINY AI</text><rect width="760" height="42" x="360" y="406" fill="#d7e4f2" rx="21"/><text x="1150" y="437" fill="#5a7184" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="26" font-weight="600">63,4 мс</text><text x="140" y="520" fill="#2c5c99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="28" font-weight="700">TINY Flash</text><rect width="48" height="42" x="360" y="490" fill="url(#flash)" rx="21"/><text x="432" y="521" fill="#2c5c99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="26" font-weight="700">2,6 мс</text><rect width="118" height="50" x="600" y="486" fill="#e8f1fb" rx="25"/><text x="624" y="520" fill="#2c5c99" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="700">×26</text><text x="140" y="618" fill="#5a7184" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="22" font-weight="500">тот же makespan · 0 расхождений на 3 061 графе · расписания законны</text><text x="140" y="668" fill="#7d93a8" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="500">скорость даёт остановка на нижней границе тактов, движок ListPlan и ленивая трасса</text><g font-family="'Segoe UI', 'Inter', Arial, sans-serif"><rect width="456" height="244" x="80" y="786" fill="#fff" filter="url(#shadow)" rx="22"/><text x="120" y="842" fill="#7d93a8" font-size="20" font-weight="700" letter-spacing="3">TINY AI</text><text fill="#33475b" font-size="23" font-weight="500"><tspan x="120" y="894">Считает все кандидаты</tspan> <tspan x="120" y="930">до конца. Надёжно,</tspan> <tspan x="120" y="966">но около 40 мс на граф.</tspan></text><rect width="456" height="244" x="572" y="786" fill="#fff" stroke="#4b86cf" stroke-width="2" filter="url(#shadow)" rx="22"/><text x="612" y="842" fill="#2c5c99" font-size="20" font-weight="700" letter-spacing="3">TINY FLASH</text><text fill="#33475b" font-size="23" font-weight="500"><tspan x="612" y="894">Останавливается, когда</tspan> <tspan x="612" y="930">достигнута нижняя граница.</tspan> <tspan x="612" y="966">Результат тот же, ×26 быстрее.</tspan></text><rect width="456" height="244" x="1064" y="786" fill="#fff" filter="url(#shadow)" rx="22"/><text x="1104" y="842" fill="#b4552f" font-size="20" font-weight="700" letter-spacing="3">РЕЖИМ ASM</text><text fill="#33475b" font-size="23" font-weight="500"><tspan x="1104" y="894">Ещё быстрее, но на 6 графах</tspan> <tspan x="1104" y="930">из 300 хуже. Гарантии нет,</tspan> <tspan x="1104" y="966">поэтому выключен по умолчанию.</tspan></text></g><g fill="#5a7184" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="600"><rect width="46" height="30" x="80" y="1082" fill="#0b2a4a" rx="7"/><path fill="none" stroke="#9fc3ea" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M92 1105 L104 1094 L116 1105"/><text x="146" y="1105">NEX CLI <tspan fill="#9aa9b8">× Эльбрус</tspan></text></g></svg>