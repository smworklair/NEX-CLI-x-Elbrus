name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with TUI extras
        run: pip install -e ".[tui]"
      - name: Run test suite
        run: python -m unittest discover -s tests
