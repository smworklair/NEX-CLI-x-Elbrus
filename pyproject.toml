# Packaging for contributors. Core (scheduler + CLI) works on
# stock Python with no hard dependencies; rich/textual are optional extras
# (without them the tool still runs, only the fullscreen TUI is off).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vliw-ai-scheduler"
version = "1.4"
description = "VLIW instruction-scheduler prototype: greedy baseline vs exact-search oracle (Elbrus e2k machine model)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Source-available: free for educational and personal use; commercial use requires a separate license. See LICENSE." }
authors = [{ name = "shokha" }]
keywords = ["vliw", "scheduling", "elbrus", "compiler", "instruction-scheduling"]
dependencies = []

[project.optional-dependencies]
# Fullscreen TUI + colored output.
tui = ["rich>=13", "textual>=8.2"]
# Learned-model track (training/inference). Heavy; not needed for the
# scheduler, the oracle, or the TUI.
learned = ["torch", "transformers", "peft", "accelerate", "safetensors"]
dev = ["rich>=13", "textual>=8.2"]

[project.scripts]
vliw = "vliw.cli:main"

[tool.setuptools.packages.find]
# Ядро планировщика, NNL-блоки (включая блок помощи) и модель ISA: код
# импортирует их по именам, поэтому они должны попадать в установку.
include = ["vliw*", "nex_core*", "nnl_vliw*", "nnl_isa*"]

# Runtime data shipped inside the package: Textual CSS, UI themes, лёгкие веса
# NNL-ассистента и сами NNL-блоки (паспорт + веса + датасет обучения).
[tool.setuptools.package-data]
vliw = ["tui/*.tcss", "ui/themes/*.json", "help_weights.json"]
nnl_vliw = [
    "**/*.json",
    "**/*.jsonl",
    "**/*.npz",
    "**/*.md",
    "архитектуры/*.py",
]
nnl_isa = ["**/*.json", "**/*.npz", "**/*.md"]
nex_core = ["**/*.json", "**/*.npz"]
